project:
  name: plantvillage-neural-network
  task: image_classification
  num_classes: 38
  framework: tensorflow

data:
  source: TO_BE_CONFIRMED
  image_size: [224, 224]
  color_mode: rgb
  batch_size: 32
  train_fraction: 0.70
  validation_fraction: 0.15
  test_fraction: 0.15
  split_seed: 42

training:
  seed: 42
  epochs: 30
  learning_rate: 0.001
  optimizer: adam
  early_stopping:
    monitor: val_loss
    patience: 5
    restore_best_weights: true

experiments:
  learning_rates: [0.01, 0.001, 0.0001]
  batch_sizes: [16, 32, 64]
  optimizers: [sgd, sgd_momentum, adam]
